name: Release Please

# 治理规范 §10.2 / 2026-10-18 裁决：恢复 release-please 自动发版（推翻本仓 2026-09-05 的自停决定），
# 与 TTS-MultiModel 的自动化口径统一。分工：release-please 负责开 release PR + 打 tag；
# 打出的 v* tag 再触发本仓既有 release.yml 在远端构建资产（§10.1 远端优先，本地不出包）。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-please 靠 tag 定位「上一个 release」，默认浅检出拿不到 tag 会静默空转。
          fetch-depth: 0
          persist-credentials: true

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          include-component-in-tag: false

      - name: 结果写进 job 摘要（避免「什么都没发生」被当成成功）
        env:
          CREATED: ${{ steps.rp.outputs.release_created || '' }}
          PR: ${{ steps.rp.outputs.pr || '' }}
          TAG: ${{ steps.rp.outputs.tag_name || '' }}
        run: |
          set -eu
          {
            echo "## release-please"
            echo "- release_created: `${CREATED:-false}`"
            echo "- release PR: `${PR:-（本次没有开）}`"
            echo "- tag: `${TAG:-无}`"
          } >> "$GITHUB_STEP_SUMMARY"

      # §10 资产链修复（2026-10-20）：release-please 用 GITHUB_TOKEN 经 API 建的 tag/Release
      # 不触发下游 push/release 事件（GitHub 防递归规则），导致 release.yml 从未运行、资产为空。
      # workflow_dispatch 是该规则下的例外，故在 release 创建后于同一 run 内显式 dispatch release.yml。
      - name: 触发资产构建 release.yml（workflow_dispatch 例外路径）
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          set -eu
          if [ -z "${TAG:-}" ]; then
            echo "release_created=true 但 tag_name 为空，异常，退出"
            exit 1
          fi
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
          echo "已触发 release.yml（ref=tag=$TAG）"
